name: Build Android Kotlin APK

on:
  push:
    branches: [ "main", "master" ] # Triggers whenever you push code to these branches
  workflow_dispatch: # Allows you to manually trigger the build from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the Repository
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle' # Caches dependencies so future builds run faster

    - name: Grant Execute Permission to Gradle Wrapper
      run: chmod +x gradlew

    - name: Assemble Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: kotlin-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
