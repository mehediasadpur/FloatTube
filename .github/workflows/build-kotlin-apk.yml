name: Build Android Kotlin APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the Repository
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # This sets up a global Gradle build tool since your project lacks one
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # We use 'gradle' directly instead of './gradlew'
        - name: Assemble Debug APK
      run: gradle assembleDebug -Pandroid.injected.kotlin.jvm.target=17 -Pandroid.injected.java.target=17

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: kotlin-debug-apk
        path: "**/build/outputs/apk/debug/*.apk" # Wildcard path to find the APK anywhere it lands
