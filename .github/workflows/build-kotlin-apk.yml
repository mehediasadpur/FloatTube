name: Build Android Kotlin APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the Repository
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # This sets up a global Gradle build tool since your project lacks a local wrapper
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Fixed indentation and optimized flags to forcefully sync Java compiler variants
    - name: Assemble Debug APK
      run: |
        gradle assembleDebug \
          -Dorg.gradle.java.home=$JAVA_HOME \
          -Pandroid.kotlinOptions.jvmTarget=17

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: kotlin-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
